
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Work | Vallari Sakpal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
</head>

<body class="page-work">

  <!-- Grid frame lines -->
  <div class="frame" aria-hidden="true">
    <span class="line v left"></span>
    <span class="line v right"></span>
    <span class="line h top"></span>
    <span class="line h bottom"></span>
  </div>

  <!-- Navigation -->
  <header class="nav">
    <a href="homepage.html" class="nav-link">home</a>

    <nav class="nav-right">
      <a href="workbase.html" class="nav-link active" aria-current="page">work</a>
      <a href="contact.html" class="nav-link">contact</a>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <h1 class="work-title">work</h1>

    <!-- Project folders -->
    <div class="folders">

      <!-- Swift: Green folder with project previews -->
      <a href="swift.html" class="folder-link">

        <div class="folder-preview" aria-hidden="true">
          <img src="ldm1.png" alt="" class="preview-image image-one">
          <img src="ldm2.png" alt="" class="preview-image image-two">
          <img src="ldm1Cropped.png" alt="" class="preview-image image-three">
        </div>

        <img src="greenFolder.png" alt="" class="folder swift">

        <span class="folder-name">Swift</span>
      </a>

      
      <!-- Kirby: Yellow folder with project preview -->
       <a href="Kirby.html" class="folder-link">

      <div class="folder-preview" aria-hidden="true">
      <img src="kirbyDown.png" alt="" class="preview-image kirby-preview">
     </div>

     <img src="yellowFolder.png" alt="" class="folder kirby">

     <span class="folder-name">Kirby</span>
     </a>


      <!-- Comic: Pink folder with project previews -->
     <a href="comic.html" class="folder-link">

      <div class="folder-preview" aria-hidden="true">
     <img src="page2.jpg" alt="" class="preview-image image-one">
     <img src="page3.jpg" alt="" class="preview-image image-two">
     <img src="page7.jpg" alt="" class="preview-image image-three">
     </div>
  
     <img src="pinkFolder.png" alt="" class="folder comic">

     <span class="folder-name">Comic</span>
     </a>

    </div>
  </main>

</html>
