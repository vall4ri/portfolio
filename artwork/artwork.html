<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Mondrian</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ecebe6;
    }

    /* Black gaps between the cells act as the Mondrian lines */
    .wrapper {
      display: grid;
      width: min(92vmin, 720px);
      aspect-ratio: 1 / 1;
      background: #1a1415;
      border: 6px solid #1a1415;
      gap: 10px;
      grid-template-columns: 1fr 2fr 1fr 3fr 1fr 2fr;
      grid-template-rows: 2fr 1fr 3fr 1fr 2fr;
      grid-template-areas:
        "a a b c c c"
        "d e b f f g"
        "d e h h i g"
        "j j h h i k"
        "l m m n n k";
    }

    .a { grid-area: a; background: #e8e8e3; }
    .b { grid-area: b; background: #e8e8e3; }
    .c { grid-area: c; background: #f0c24b; }  /* yellow */
    .d { grid-area: d; background: #d4321f; }  /* red */
    .e { grid-area: e; background: #e8e8e3; }
    .f { grid-area: f; background: #e8e8e3; }
    .g { grid-area: g; background: #cfcfca; }  /* gray */
    .h { grid-area: h; background: #1f2fbf; }  /* big blue plane */
    .i { grid-area: i; background: #1a1415; }  /* black */
    .j { grid-area: j; background: #e8e8e3; }
    .k { grid-area: k; background: #f0c24b; }  /* yellow */
    .l { grid-area: l; background: #1a1415; }  /* black */
    .m { grid-area: m; background: #e8e8e3; }
    .n { grid-area: n; background: #d4321f; }  /* red */
  </style>
</head>
<body>
  <main class="wrapper" role="img"
        aria-label="Original Mondrian-style composition with a large blue plane, red, yellow, black, gray and white blocks.">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>
    <div class="f"></div>
    <div class="g"></div>
    <div class="h"></div>
    <div class="i"></div>
    <div class="j"></div>
    <div class="k"></div>
    <div class="l"></div>
    <div class="m"></div>
    <div class="n"></div>
  </main>
</body>
</html>
